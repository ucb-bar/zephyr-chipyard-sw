# Board-specific Kconfig for the riskybird v3 FPGA Rocket combined config
# (RocketArty200TDroneGemminiSaturnFp16At35Config @ 35 MHz). Auto-applied by
# Zephyr for board chipyard_riscv64. Same values as the working modelblaster
# FPGA build's mb_fpga.conf.
#
# misa = 0x...b41105 = RV64 IMAC + V (+S/U/X); NO hardware F/D (the scalar FPU
# is fp16-only). Build soft-float.

# SiFive console UART @ 35 MHz peripheral clock -> 115200 baud on /dev/ttyUSB1.
CONFIG_UART_HTIF=n
CONFIG_UART_SIFIVE=y
CONFIG_UART_SIFIVE_PORT_0=y
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=35000

# No hardware fp32/fp64 on this bitstream -> soft float.
CONFIG_FPU=n
CONFIG_FPU_SHARING=n
CONFIG_CBPRINTF_FP_SUPPORT=y
