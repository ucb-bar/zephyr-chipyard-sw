# Gemmini conv microbenchmark — Zephyr config.
# Mirrors the working FPGA hetero build (gemmini_q31_rvv backend + mb_fpga.conf):
# picolibc (sqrt for tiled_matmul_auto's tile-size macros), 4 MB main stack,
# Saturn RVV enabled but restricted to kernel/bench code, single hart.

CONFIG_MAIN_STACK_SIZE=4194304
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y

# Saturn vector unit (used by the RVV im2col / transpose / requantize helpers,
# exactly as the modelblaster im2col_full_C kernel uses them). Eager context
# switch + kernel-only V codegen, same as backends/gemmini_q31_rvv.conf.
CONFIG_RISCV_ISA_EXT_V=y
CONFIG_RISCV_ISA_EXT_V_LAZY=n
CONFIG_RISCV_V_KERNEL_ONLY=y

# No hardware fp32/fp64 on this bitstream -> soft float (overridden anyway by
# the EXTRA mb_fpga.conf, kept here so a bare build is still correct).
CONFIG_FPU=n
