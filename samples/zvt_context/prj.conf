# Zvt tile context-switch test (single hart, time-sliced).
CONFIG_FPU=y
CONFIG_RISCV_ISA_EXT_V=y
CONFIG_RISCV_ISA_EXT_V_LAZY=n
# Keep libc/ISRs scalar: an ISR that auto-vectorizes (e.g. picolibc memcpy)
# would clobber vl/vtype -- and with them mtype -- without a context switch.
CONFIG_RISCV_V_KERNEL_ONLY=y
CONFIG_RISCV_ISA_EXT_ZVT=y
CONFIG_RISCV_ZVT_TE=32
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=1
CONFIG_TIMESLICE_PRIORITY=0
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ASSERT=y
CONFIG_PRINTK=y
