# Zephyr Project Configuration for RVV LQR Riccati

# Enable console and shell for output
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# Enable timing subsystem for performance measurement
CONFIG_TIMING_FUNCTIONS=y

# Enable heap and memory management
CONFIG_HEAP_MEM_POOL_SIZE=262144
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

# # Enable C++ support
# CONFIG_CPP=y
# CONFIG_STD_CPP17=y

# # Enable newlib for math functions
# CONFIG_NEWLIB_LIBC=y
# CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
# CONFIG_NEWLIB_LIBC_FLOAT_SCANF=y


CONFIG_CPP=y
# CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_MAIN_STACK_SIZE=32768000

CONFIG_SMP=n
CONFIG_POSIX_API=y
CONFIG_MULTITHREADING=y

CONFIG_STD_C17=y
CONFIG_STD_CPP20=y 
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_PICOLIBC=y
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_RISCV_ISA_EXT_V=y

# Enable random number generation
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# Memory configuration
CONFIG_SRAM_SIZE=1048576

# Disable SMP for simplicity (single core)
CONFIG_SMP=n
CONFIG_MP_MAX_NUM_CPUS=1

# # Debug options (can be disabled for production)
# CONFIG_DEBUG=y
# CONFIG_DEBUG_INFO=y
# CONFIG_ASSERT=y

# Optimize for performance
CONFIG_SPEED_OPTIMIZATIONS=y

# Enable floating point support
CONFIG_FPU=y

# Enable kernel debugging
CONFIG_KERNEL_SHELL=y

CONFIG_RISCV_ISA_EXT_V=y