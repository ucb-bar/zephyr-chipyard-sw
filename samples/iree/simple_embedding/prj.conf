CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# IREE VM module initialization uses an 8KB inline VM stack buffer on the C
# stack (see IREE_VM_STACK_DEFAULT_SIZE). 8KB main stack is too tight and can
# silently corrupt memory, showing up later as heap faults during __init.
CONFIG_MAIN_STACK_SIZE=32768

# Catch stack overflows earlier (helps confirm/deny stack corruption hypotheses).
CONFIG_THREAD_STACK_INFO=y
CONFIG_STACK_SENTINEL=y

# IREE + embedded VMFB + HAL buffers require non-trivial heap usage.
# Make heap explicit (similar to the xnnpack sample).
CONFIG_HEAP_MEM_POOL_SIZE=1048576
CONFIG_COMMON_LIBC_MALLOC=y

# Enable POSIX APIs/threads in case linked components expect pthread symbols.
CONFIG_POSIX_API=y
CONFIG_MULTITHREADING=y
CONFIG_POSIX_THREADS=y

