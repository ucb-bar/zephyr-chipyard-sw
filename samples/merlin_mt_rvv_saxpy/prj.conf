CONFIG_THREAD_STACK_INFO=y
CONFIG_MP_MAX_NUM_CPUS=4
CONFIG_SMP=y
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
CONFIG_SCHED_DUMB=y
CONFIG_MAIN_STACK_SIZE=65536

CONFIG_FPU=y
CONFIG_FLOAT_HARD=y
CONFIG_FPU_SHARING=y

# Multithreaded multicore RVV. See arch/riscv/core/v.c for the per-thread V
# save/restore. The three settings below are jointly required:
#  - ISA_EXT_V_LAZY=n  -> use the eager V save/restore (the fork's production
#    path); the Kconfig default y gates it out and MSTATUS.VS stays OFF, so the
#    first vector instruction in a thread traps illegal-instruction.
#  - V_KERNEL_ONLY=y   -> keep the global -march at rv64gc so the app + the
#    SDK's non-V picolibc link; V instructions come from .option arch,+v asm.
CONFIG_RISCV_ISA_EXT_V=y
CONFIG_RISCV_VECTOR_MAX_LEN=256
CONFIG_RISCV_V_KERNEL_ONLY=y
CONFIG_RISCV_ISA_EXT_V_LAZY=n
