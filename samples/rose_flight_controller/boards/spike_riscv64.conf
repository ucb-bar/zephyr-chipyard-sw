# RoSE co-sim target: bridge driver + protocol + virtual sensor drivers (bound by
# boards/spike_riscv64.overlay). The app reads them through the standard sensor API.
CONFIG_ROSE=y
CONFIG_ROSE_PROTOCOL=y
CONFIG_ROSE_SENSOR_IMU=y
CONFIG_ROSE_SENSOR_FLOW=y
CONFIG_ROSE_SENSOR_TOF=y

CONFIG_PICOLIBC=y
CONFIG_COMMON_LIBC_MALLOC=y

# spike_riscv64 has a hardware FPU (the estimator uses float math).
CONFIG_FPU=y
