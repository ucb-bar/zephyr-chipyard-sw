# Real ESP32C6 target: I2C + real sensor drivers (bound by
# boards/esp32c6_devkitc_hpcore.overlay). The app reads them through the same sensor API
# as the RoSE virtual drivers -- only these Kconfigs + the overlay differ.
CONFIG_I2C=y
CONFIG_BMI08X=y
# VL53L1X down-ToF (hal_st now vendored). Polling mode: no DRDY int-gpio wired; the ADS7128
# powers XSHUT (board_sensor_init SYS_INIT), not a Zephyr gpio, so no CONFIG_VL53L1X_XSHUT.
CONFIG_VL53L1X=y
CONFIG_VL53L1X_INTERRUPT_MODE=n

# 4 side-facing VL53L5CX (8x8) wall sensors for the bumper (src/side_tof.c). Brought up + readdressed
# to 0x31-0x34 at runtime via the ADS7128; center-zone distance read on a background thread.
CONFIG_VL53L5CX=y
CONFIG_VL53L5CX_DEFAULT_RESOLUTION_8X8=y

# printf float support for the diagnostics
CONFIG_CBPRINTF_FP_SUPPORT=y

# Motor output: LEDC PWM driving the 4 low-side SI2302 gates (see overlay `motors`).
CONFIG_PWM=y

# On-board flight logging to the 'storage' flash partition (src/flightlog.c; gated by
# -DROSE_FLIGHTLOG / -DROSE_FLIGHTLOG_DUMP in main.cpp). Needs the flash driver + flash-map API.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
