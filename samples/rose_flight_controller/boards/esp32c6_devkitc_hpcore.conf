# Real ESP32C6 target: I2C + real sensor drivers (bound by
# boards/esp32c6_devkitc_hpcore.overlay). The app reads them through the same sensor API
# as the RoSE virtual drivers -- only these Kconfigs + the overlay differ.
CONFIG_I2C=y
CONFIG_BMI08X=y
# VL53L1X down-ToF (hal_st now vendored). Polling mode: no DRDY int-gpio wired; the ADS7128
# powers XSHUT (board_sensor_init SYS_INIT), not a Zephyr gpio, so no CONFIG_VL53L1X_XSHUT.
CONFIG_VL53L1X=y
CONFIG_VL53L1X_INTERRUPT_MODE=n

# printf float support for the diagnostics
CONFIG_CBPRINTF_FP_SUPPORT=y
