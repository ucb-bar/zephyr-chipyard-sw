# RoSE bridge driver + protocol layer
CONFIG_ROSE=y
CONFIG_ROSE_PROTOCOL=y
CONFIG_PRINTK=y

# C++ + a large main stack for the TinyMPC solver + estimator working set
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=n
CONFIG_MAIN_STACK_SIZE=327680
CONFIG_PICOLIBC=y
CONFIG_COMMON_LIBC_MALLOC=y

# libm (atan2f/sinf/cosf/sqrtf used by the estimator)
CONFIG_FPU=y

# Enable RVV here (and set -DRISCV_VECTOR in the build) only if the target/board
# supports the vector extension; the default spike_riscv64 build is scalar.
# CONFIG_RISCV_ISA_EXT_V=y
# CONFIG_RISCV_VECTOR_MAX_LEN=512

CONFIG_BOOT_BANNER=n
