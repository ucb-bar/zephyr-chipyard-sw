# Shared (board-agnostic) config for the flight controller. The SENSOR DRIVERS are
# board-specific and live in boards/<board>.conf:
#   - boards/spike_riscv64.conf          -> RoSE virtual sensor drivers (co-sim)
#   - boards/esp32c6_devkitc_hpcore.conf -> real bosch,bmi08x / st,vl53l1x drivers
# main/estimator/TinyMPC are identical across both.

CONFIG_SENSOR=y
CONFIG_PRINTK=y

# C++ + a large main stack for the TinyMPC solve (single-loop default runs it in main; the
# opt-in threaded build runs it in the control thread, which has its own equally-large stack).
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=n
CONFIG_MAIN_STACK_SIZE=327680

# NOTE: CONFIG_FPU is board-specific (spike_riscv64 has an FPU; the ESP32C6 rv32imac core
# does not -> soft float). Set per board in boards/<board>.conf.

CONFIG_BOOT_BANNER=n

# detect a thread stack overflow (prints instead of silently corrupting)
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_NAME=y
