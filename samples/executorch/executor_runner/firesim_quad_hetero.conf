# FireSim overlay for f2_quad_hetero_norose_tacit_q31_60mhz
# (chipyard.config.SatGemQuadHeteroTacitConfig), the bitstream the ModelBlaster
# sweeps in experiments/sweep3net run on. Mirrors
# modelblaster/harness/backends/firesim_chipyard_quad_hetero_q31.conf so the two
# flows boot the SAME machine.
#
#   harts 0,1 : Rocket + Q0.31 Gemmini, rv64imafdc   -- NO vector unit
#   harts 2,3 : Rocket + Saturn VLEN256/DLEN128      -- NO Gemmini
#
# MP_MAX_NUM_CPUS MUST be 4: Zephyr's SMP boot spinwaits for every configured
# hart, so the ET samples' usual MP_MAX_NUM_CPUS=1 "inline threadpool" trick
# hangs here. The equivalent single-threaded behaviour is obtained instead with
# -DMB_ET_THREADS=1 (clamp the pthreadpool) plus -DMB_ET_PIN_HART=2 (run the ET
# region on a Saturn hart) -- see executor_runner/CMakeLists.txt.
CONFIG_MP_MAX_NUM_CPUS=4
CONFIG_SMP=y
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
CONFIG_SCHED_DUMB=y
CONFIG_MAIN_STACK_SIZE=524288
CONFIG_UART_HTIF_SYSCALL_PRINT=y
CONFIG_UART_HTIF_BUFFERED_OUTPUT=n
# V enabled tree-wide because harts 2,3 need it; RISCV_V_KERNEL_ONLY keeps
# vector state off the user-thread switch path so a hart-0/1 thread never
# touches a vector CSR (which would trap on those tiles).
CONFIG_RISCV_ISA_EXT_V=y
CONFIG_RISCV_ISA_EXT_V_LAZY=n
CONFIG_RISCV_V_KERNEL_ONLY=y
