# FireSim overlay, SINGLE-CORE variant. Same as firesim.conf but MP_MAX_NUM_CPUS=1
# so XNNPACK's pthreadpool (sized to sysconf(_SC_NPROCESSORS_ONLN)) becomes a
# 1-thread pool → every parallelize_* runs INLINE on the caller: no worker
# wakeup, no spin/futex dispatch. Best config for small models where per-op
# threadpool dispatch dominates. Splice: -DEXTRA_CONF_FILE=firesim_1core.conf
CONFIG_MP_MAX_NUM_CPUS=1
CONFIG_MAIN_STACK_SIZE=524288
CONFIG_UART_HTIF_BUFFERED_OUTPUT=y
CONFIG_UART_HTIF_SYSCALL_PRINT=y
CONFIG_UART_HTIF_BUFFERED_OUTPUT_SIZE=256
