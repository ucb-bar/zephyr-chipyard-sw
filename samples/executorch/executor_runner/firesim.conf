# FireSim (chipyard_riscv64/rocketchip_virt_riscv64) overlay for the ExecuTorch
# runner. Splice via `west build ... -- -DEXTRA_CONF_FILE=firesim.conf`.
# Mirrors modelblaster/harness/backends/firesim_chipyard.conf:
#  - HTIF-backed console so the runner's printf/ET_LOG reach the uartlog that
#    firesim_runner tails (spike used a different console path).
#  - MP_MAX_NUM_CPUS=2 to match the dual-rocket bitstream — Zephyr SMP waits
#    for all configured harts at boot, so 4 (the spike value) would hang on a
#    2-hart target.
#  - Larger main stack for the ExecuTorch runtime + XNNPACK setup.
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_MAIN_STACK_SIZE=524288
CONFIG_UART_HTIF_BUFFERED_OUTPUT=y
CONFIG_UART_HTIF_SYSCALL_PRINT=y
CONFIG_UART_HTIF_BUFFERED_OUTPUT_SIZE=256
