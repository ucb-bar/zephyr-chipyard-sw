# 1-core FireSim overlay with UNBUFFERED HTIF console. With profiling off there's
# too little output to flush the 256B HTIF buffer, and the ET runner returns
# from main without an explicit flush, so cycle markers never reach the uartlog.
# Unbuffered → each line appears immediately. The EXECUTORCH_EXECUTE_CYCLES
# printf is AFTER the execute() rdcycle bracket, so unbuffered (slower) console
# does NOT affect the measured cycle count. Splice: -DEXTRA_CONF_FILE=firesim_1core_nobuf.conf
CONFIG_MP_MAX_NUM_CPUS=1
CONFIG_MAIN_STACK_SIZE=524288
CONFIG_UART_HTIF_SYSCALL_PRINT=y
CONFIG_UART_HTIF_BUFFERED_OUTPUT=n
