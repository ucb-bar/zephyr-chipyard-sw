# RoSE navigation controller (waypoint flight via obstacle-relative position).
CONFIG_SENSOR=y
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=n
CONFIG_MAIN_STACK_SIZE=4194304
CONFIG_BOOT_BANNER=n

# DroNet vision navigation (ROSE_DRONET_NAV=1): FPV camera + preprocessing + CRC.
CONFIG_VIDEO=y
CONFIG_ROSE_CAMERA=y
CONFIG_ROSE_VISION=y
CONFIG_CRC=y
