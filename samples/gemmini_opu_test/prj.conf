CONFIG_THREAD_STACK_INFO=y
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SMP=y

CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
CONFIG_SCHED_DUMB=y

# Match dima's known-working uart_htif config: buffered output + syscall print.
# The direct putchar protocol may have an SMP race we haven't located;
# the syscall path goes through a single guarded magic_mem write per flush.
CONFIG_UART_HTIF_BUFFERED_OUTPUT=y
CONFIG_UART_HTIF_BUFFERED_OUTPUT_SIZE=256
CONFIG_UART_HTIF_SYSCALL_PRINT=y

# Do NOT globally enable CONFIG_RISCV_ISA_EXT_V -- our hart 0 has no V.

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=65536
