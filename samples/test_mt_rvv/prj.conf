# nothing here

CONFIG_THREAD_STACK_INFO=y
# CONFIG_DYNAMIC_THREAD=y
CONFIG_MP_MAX_NUM_CPUS=4
CONFIG_SMP=y

# CONFIG_DYNAMIC_THREAD_POOL_SIZE=6
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
CONFIG_SCHED_DUMB=y

CONFIG_FPU=y
CONFIG_FLOAT_HARD=y
CONFIG_FPU_SHARING=y
CONFIG_RISCV_ISA_EXT_V=y
CONFIG_RISCV_VECTOR_MAX_LEN=256
# Keep the global -march at rv64gc so app objects + the SDK's non-V picolibc
# multilib link cleanly; the V instructions in src/main.c come from inline-asm
# ".option arch, +v" blocks, and arch/riscv/core/v.c gets V re-added per-file.
CONFIG_RISCV_V_KERNEL_ONLY=y
# Use the EAGER per-thread V save/restore in arch/riscv/core/v.c (the fork's
# production path: v0..v31 + V CSRs saved/restored on every context switch).
# Kconfig defaults ISA_EXT_V_LAZY=y, which gates out the eager path in both
# v.c and switch.S and leaves V state unmanaged -> MSTATUS.VS stays OFF and the
# first vector instruction in a thread traps illegal-instruction. Turn it off.
CONFIG_RISCV_ISA_EXT_V_LAZY=n
