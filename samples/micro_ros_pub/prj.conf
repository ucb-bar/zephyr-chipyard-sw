# Skeleton micro-ROS link test for spike_riscv64.
# Goal at this step: produce a linked .elf — no transport actually runs.

CONFIG_MICROROS=y
CONFIG_APP_LINK_WITH_MICROROS=y
CONFIG_MICROROS_TRANSPORT_SERIAL=y
CONFIG_MICROROS_SERIAL_PORT="0"

# Stack/heap room for rcl/rclc allocations once we wire them up in step 4.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=131072

# POSIX clock — rcl/rclc need it.
CONFIG_POSIX_API=y

CONFIG_LOG=y
CONFIG_SERIAL=y

# Note on libc: the spike_riscv64 board defaults to picolibc (per the repo's
# toolchain layout). The upstream micro-ROS module was tested with newlib;
# we'll find out at link/runtime if picolibc is sufficient and force newlib
# (CONFIG_PICOLIBC=n + CONFIG_NEWLIB_LIBC=y) only if needed.
