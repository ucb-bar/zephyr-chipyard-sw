# RoSE fused-vision nav controller (M1 transport bring-up).
CONFIG_PRINTK=y
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=n

# fp16 tail: floating point + %g printf + RISC-V Zfh (scalar half). ZFH threads _zfh into
# -march so the compiler emits fadd.h/fcvt.s.h; run spike with --isa=rv64gc_zfh.
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_RISCV_ISA_EXT_ZFH=y

# CNN im2col scratch can allocate large stack VLAs; give generous headroom.
CONFIG_MAIN_STACK_SIZE=4194304
CONFIG_BOOT_BANNER=n

# Forward "camera" (pre-quantized int8 front frame) over the RoSE DMA path.
CONFIG_VIDEO=y
CONFIG_ROSE_CAMERA=y
