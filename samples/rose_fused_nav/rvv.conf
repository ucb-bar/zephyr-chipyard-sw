# RVV (curated rvv_f16 kernels) overlay for rose_fused_nav. Spliced via -DROSE_RVV=1.
# Mirrors ModelBlaster harness/backends/rvv_f16.conf: enable V + Zfh (scalar half) + Zvfh
# (vector half); target_riscv.cmake threads _zfh/_zvfh and V into the global -march
# (rv64gcv_zfh_zvfh). Run spike with --isa=rv64gcv_zicntr_zihpm_zfh_zvfh.
CONFIG_RISCV_ISA_EXT_V=y
CONFIG_RISCV_ISA_EXT_ZFH=y
CONFIG_RISCV_ISA_EXT_ZVFH=y
# Eager V save/restore (avoids the "first V instruction traps illegal" FPU_SHARING bug) and
# keep the compiler from auto-vectorizing libc/printk (V state must not leak across preemption).
CONFIG_RISCV_ISA_EXT_V_LAZY=n
CONFIG_RISCV_V_KERNEL_ONLY=y
