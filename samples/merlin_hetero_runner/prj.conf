# SMP configuration for FireSimGemminiAndOPUShuttleConfig (2 Shuttle tiles).
# Lessons 1-3 from docs/dev_blog/2026-05-13-zephyr-on-hetero-shuttle-firesim.md.
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_STACK_SENTINEL=y

CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SMP=y
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
CONFIG_SCHED_DUMB=y

# Lesson 3: direct-putchar HTIF has an SMP race. Use the buffered+syscall path.
CONFIG_UART_HTIF_BUFFERED_OUTPUT=y
CONFIG_UART_HTIF_BUFFERED_OUTPUT_SIZE=256
CONFIG_UART_HTIF_SYSCALL_PRINT=y

# CONFIG_FPU_SHARING defaults to y when CONFIG_FPU=y. Its trap handler
# (z_riscv_fpu_trap) catches FP-illegal-instr traps AND incorrectly
# claims V-illegal-instr traps (the trap-entry path at isr.S:264 checks
# for opcode 0x57 = VECTOR and routes to is_fp when CONFIG_RISCV_ISA_EXT_V
# is set, but the FPU re-enable logic doesn't actually restore V state).
# Net effect: V illegal-instruction silently retries forever — the silent
# hang we observed on RVV/OPU after `bind[N] stored`. Turning off FPU
# sharing routes V traps through the standard fault path so we see the
# crash (then deal with VS=Off properly with set_vs_dirty() in the worker
# entry, which works for non-preempted threads).
CONFIG_FPU_SHARING=n

# Lesson 2 from 2026-05-13 dev blog: do NOT set CONFIG_RISCV_ISA_EXT_V=y.
# Even with the default LAZY mode the Zephyr boot path traps on hart 0
# (silent hang at "tsibridge_t::tick skipping tick" before Zephyr's
# "Booting Zephyr OS" banner — verified 2026-05-13). The lazy-V trap
# handler is gated on Zephyr seeing the thread as "V-allowed", but
# something earlier in arch-init touches V regs unconditionally.
#
# Workaround: per-hart VS=Dirty preamble (set_vs_dirty()) plus COOP
# scheduling on the worker thread. Limitation: the system timer tick
# IRQ still fires and Zephyr's trap-return restores a saved mstatus
# with VS=Off → V instructions re-trap. Without enabling V at Kconfig
# level, the only robust path is a custom illegal-instruction trap
# handler that promotes saved mstatus.MPV to Dirty and mrets to retry.
# Defer that to a follow-up; scalar+gemmini paths work today.

# IREE VM module init uses an 8KB inline VM stack; need headroom on main stack.
CONFIG_MAIN_STACK_SIZE=32768

# Libc: picolibc (Zephyr SDK default).
# The IREE archives in $MERLIN_ROOT/build/zephyr-vanilla-release/ reference
# newlib's _ctype_, _impure_ptr, __errno — picolibc doesn't have them.
# Rather than rebuild IREE against a different libc, we bridge via
# src/iree_picolibc_compat.c which provides stub definitions. Those
# references are only present from archive-symbol resolution; the actual
# code paths are dead under IREE_PLATFORM_GENERIC + IREE_ENABLE_THREADING=OFF
# + IREE_FILE_IO_ENABLE=0 and --gc-sections drops them at the final link.

# Let picolibc's libc.a provide malloc/free. CONFIG_COMMON_LIBC_MALLOC
# is defaulted on by something in the dep chain — explicitly disable to
# stop Zephyr's common malloc from colliding with picolibc's
# nano-malloc.c. Real __heap_start/__heap_end symbols are exported from
# src/iree_picolibc_compat.c so picolibc's sbrk has a working 4 MiB BSS
# heap.
CONFIG_COMMON_LIBC_MALLOC=n

# IREE + embedded VMFB + HAL buffers + per-model input/output tensors.
# 4 MiB covers yolov8n (700KB output) with plenty of slack.
CONFIG_HEAP_MEM_POOL_SIZE=4194304

# POSIX shim — IREE compiles cleanly under IREE_PLATFORM_GENERIC but the
# Zephyr-side glue assumes POSIX-like nullable wait/time primitives.
CONFIG_POSIX_API=y
CONFIG_MULTITHREADING=y
CONFIG_POSIX_THREADS=y

# Pull in the merlin-iree Zephyr module's static IREE runtime archives.
# The module Kconfig (chipyard zephyrproject/modules/merlin-iree/zephyr/Kconfig)
# gates archive import + the merlin_iree interface library on this option.
CONFIG_MERLIN_IREE=y
CONFIG_FPU=y
