# Two-node micro-ROS smoke test.

CONFIG_MICROROS=y
CONFIG_APP_LINK_WITH_MICROROS=y
# A transport choice has to be selected for the libmicroros module to build —
# we override it at runtime via rmw_uros_set_custom_transport(). The serial
# transport's stub functions get linked but never run.
CONFIG_MICROROS_TRANSPORT_SERIAL=y
CONFIG_MICROROS_SERIAL_PORT="0"

CONFIG_MICROROS_NODES="2"
CONFIG_MICROROS_PUBLISHERS="2"
CONFIG_MICROROS_SUBSCRIBERS="0"
CONFIG_MICROROS_CLIENTS="0"
CONFIG_MICROROS_SERVERS="0"

# rclc executor + two timers + transport reader thread; must accommodate
# the largest stack a colcon-built rcl call needs (rosidl init paths can
# burn through ~8K).
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_HEAP_MEM_POOL_SIZE=262144

# rcl/rclc reaches into POSIX clock and pthread internals on some paths.
CONFIG_POSIX_API=y

# Plain printk to console — no LOG subsystem. With CONFIG_LOG=y and the
# default deferred mode, printk text routes through the logger thread, which
# has to compete with our HTIF reader thread for the htif_lock mutex; the
# net effect is that boot-time printks never reach stdout in spike runs
# without a connected agent. Direct printk avoids that dependency entirely.
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# rosidl-generator emits __attribute__((constructor)) for type-support
# registration; Zephyr 4.2 requires this Kconfig to honor them at boot.
CONFIG_STATIC_INIT_GNU=y
