CONFIG_SENSOR=y
CONFIG_BMI08X=y
CONFIG_I2C=y

# Threading support
CONFIG_MULTITHREADING=y

# Logging
CONFIG_LOG=y
# Enable asynchronous logging to prevent blocking on UART transmission
CONFIG_LOG_MODE_DEFERRED=y
# Increase log buffer size for better throughput
CONFIG_LOG_BUFFER_SIZE=8192
# Enable UART backend for logging
CONFIG_LOG_BACKEND_UART=y
# Use immediate flush for better real-time behavior (optional, can remove if still slow)
# CONFIG_LOG_BACKEND_UART_OUTPUT_DICTIONARY=n
# CONFIG_LOG_BACKEND_UART_OUTPUT_TIMESTAMP=y

# Stack sizes
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ATTITUDE_ESTIMATOR_STACK_SIZE=2048

# Attitude estimator configuration
CONFIG_ATTITUDE_ESTIMATOR_FREQUENCY=200

