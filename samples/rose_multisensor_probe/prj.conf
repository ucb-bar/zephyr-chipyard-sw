# RoSE multizone-ToF data-collection probe (co-sim). Reads the 4 horizontal VL53L5CX zone
# grids over the RoSE bridge through the reusable ucbbar,rose-tof-zone driver.
CONFIG_SENSOR=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=n
# Match the (working) flight-controller image layout: with a tiny image __global_pointer$
# ends up >2KB from z_interrupt_stacks and the RISC-V GPREL relocation in the kernel's
# stacktrace code truncates at link. The C++ runtime + a large main stack grow .data/.bss
# so gp lands in range (spike_riscv64 forces the RISCV_GP choice on).
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=n
CONFIG_MAIN_STACK_SIZE=327680
