# SMP configuration for FireSimGemminiAndOPUShuttleConfig (2 Shuttle tiles).
# Lessons 1-3 from docs/dev_blog/2026-05-13-zephyr-on-hetero-shuttle-firesim.md.
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
# 2026-05-24: STACK_SENTINEL + THREAD_STACK_INFO add a canary check at
# every thread-switch and reserve a tracking struct per thread. Debug
# aids only — disabled for profile-clean runs. Re-enable if we hit a
# stack-overflow regression and need the canary diagnostic.
CONFIG_THREAD_STACK_INFO=n
CONFIG_STACK_SENTINEL=n

CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SMP=y
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
CONFIG_SCHED_DUMB=y

# Lesson 3: direct-putchar HTIF has an SMP race. Use the buffered+syscall path.
CONFIG_UART_HTIF_BUFFERED_OUTPUT=y
CONFIG_UART_HTIF_BUFFERED_OUTPUT_SIZE=256
CONFIG_UART_HTIF_SYSCALL_PRINT=y

# CONFIG_FPU_SHARING defaults to y when CONFIG_FPU=y. Its trap handler
# (z_riscv_fpu_trap) catches FP-illegal-instr traps AND incorrectly
# claims V-illegal-instr traps. Turning off FPU sharing routes V traps
# through the standard fault path so we see the crash (then deal with
# VS=Off properly with set_vs_dirty() in the worker entry, which works
# for non-preempted threads).
CONFIG_FPU_SHARING=n

# Do NOT set CONFIG_RISCV_ISA_EXT_V=y here.
#
# 2026-06-02: bumped the Zephyr submodule to saturn-fork-wip (which
# adds arch/riscv/core/v.c with decoupled V/F save-restore + native
# RISCV_V_KERNEL_ONLY Kconfig) and tried enabling V properly:
#   Variant A (V=y, LAZY=n, FPU_SHARING=y, V_KERNEL_ONLY=y):
#     dronet -0.5% bit-perfect ✓, mlp_wide +3.7% bit-perfect ✓,
#     yolov8n BIT-PERFECT FAILED (hash 0x9351d8a30bab3ddc).
#   Variant B (V=y, LAZY=n, FPU_SHARING=n, V_KERNEL_ONLY=y):
#     yolov8n BIT-PERFECT FAILED with a DIFFERENT wrong hash
#     (0xce3cecd5a07215b9).
# Two different wrong hashes confirms timing-dependent state corruption
# from v.c's V-state save/restore on context switch — likely a v-reg
# save/restore bug that only surfaces under yolov8n's high
# preemption-point count (1.7B cycles, 297+ dispatches). dronet and
# mlp_wide are too short to trigger it.
#
# Workaround until v.c is debugged: keep V disabled at Kconfig and
# use the set_vs_dirty() preamble + irq_lock around iree_vm_invoke.
# Worker thread on hart 1 never gets preempted during dispatch →
# v-regs and m-regs stay consistent within one model invoke.

# IREE VM module init uses an 8KB inline VM stack; need headroom on main stack.
CONFIG_MAIN_STACK_SIZE=32768

# Libc: picolibc (Zephyr SDK default).
# The IREE archives in $MERLIN_ROOT/build/zephyr-vanilla-release/ reference
# newlib's _ctype_, _impure_ptr, __errno — picolibc doesn't have them.
# Rather than rebuild IREE against a different libc, we bridge via
# src/iree_picolibc_compat.c which provides stub definitions. Those
# references are only present from archive-symbol resolution; the actual
# code paths are dead under IREE_PLATFORM_GENERIC + IREE_ENABLE_THREADING=OFF
# + IREE_FILE_IO_ENABLE=0 and --gc-sections drops them at the final link.

# Let picolibc's libc.a provide malloc/free. CONFIG_COMMON_LIBC_MALLOC
# is defaulted on by something in the dep chain — explicitly disable to
# stop Zephyr's common malloc from colliding with picolibc's
# nano-malloc.c. Real __heap_start/__heap_end symbols are exported from
# src/iree_picolibc_compat.c so picolibc's sbrk has a working 4 MiB BSS
# heap.
CONFIG_COMMON_LIBC_MALLOC=n

# IREE + embedded VMFB + HAL buffers + per-model input/output tensors.
# 2026-05-22: bumped to 64 MiB. yolov8n's 9.35 MB Gemmini VMFB expands to
# ~20 MB of loaded dispatch ELFs + intermediate buffers and tripped
# RESOURCE_EXHAUSTED in iree_hal_executable_create with 4 MiB. The chipyard
# SoC has 256 MiB SRAM at 0x80000000 so 64 MiB is well within budget.
CONFIG_HEAP_MEM_POOL_SIZE=67108864

# POSIX shim — IREE compiles cleanly under IREE_PLATFORM_GENERIC but the
# Zephyr-side glue assumes POSIX-like nullable wait/time primitives.
CONFIG_POSIX_API=y
CONFIG_MULTITHREADING=y
CONFIG_POSIX_THREADS=y

# Pull in the merlin-iree Zephyr module's static IREE runtime archives.
# The module Kconfig (chipyard zephyrproject/modules/merlin-iree/zephyr/Kconfig)
# gates archive import + the merlin_iree interface library on this option.
CONFIG_MERLIN_IREE=y
CONFIG_FPU=y
