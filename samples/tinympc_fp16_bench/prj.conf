# Standalone fp16 TinyMPC benchmark for the misa.F=0 Saturn Rocket bench.

# Console on the SiFive UART0 (ttyUSB1) as text; no HTIF (overlay moves console).
CONFIG_UART_CONSOLE=y
CONFIG_UART_HTIF=n
CONFIG_SERIAL=y
CONFIG_UART_SIFIVE=y
CONFIG_UART_SIFIVE_PORT_0=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=n

CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=n
CONFIG_PICOLIBC=y

# Single hart, single thread.
CONFIG_SMP=n
CONFIG_MP_MAX_NUM_CPUS=1

# FP config mirrors the validated fp16 build (build_mb_rvv_f16):
#  FPU=y     -> selects RISCV_ISA_EXT_F, which Zfh/Zvfh require for -march.
#  FLOAT_HARD=n -> soft (lp64) ABI; fp16 hardware still used via -march, but no
#                  hardware fp32/fp64 in the calling convention (misa.F=0 safe).
#  FPU_SHARING=n -> no per-thread FP save/restore (no fcsr touched at switch).
CONFIG_FPU=y
CONFIG_FLOAT_HARD=n
CONFIG_FPU_SHARING=n

# CRITICAL for misa.F=0: skip the boot-time `fscsr zero` (illegal here).
# mstatus.FS/VS are still enabled in reset.S; we also force them in main.
CONFIG_RISCV_SKIP_BOOT_FCSR=y

# VECTOR fp16 only. This core traps on scalar Zfh (FLH/FSH), so do NOT enable
# scalar ZFH -> the compiler uses soft-float for scalar _Float16 while the
# hot-path matlib vector intrinsics still emit hardware Zvfh (vle16/vfmacc.vv).
CONFIG_RISCV_ISA_EXT_ZVFH=y
CONFIG_RISCV_ISA_EXT_V=y
CONFIG_RISCV_VECTOR_MAX_LEN=128

CONFIG_MAIN_STACK_SIZE=32768
CONFIG_SPEED_OPTIMIZATIONS=y

# Peripheral clock = SYS_CLOCK_HW_CYCLES_PER_SEC * RTC_CLOCK_DIVIDER_VALUE, and the
# SiFive UART baud divisor uses it. Bench (At35): timebase 35 kHz, periph clk 35 MHz
# -> 35000 * 1000 = 35e6, giving a correct 115200 baud on ttyUSB1.
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=35000
CONFIG_RTC_CLOCK_DIVIDER_VALUE=1000
