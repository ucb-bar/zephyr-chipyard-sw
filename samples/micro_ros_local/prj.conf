# Self-contained two-node micro-ROS sample.

CONFIG_MICROROS=y
CONFIG_APP_LINK_WITH_MICROROS=y
# Kconfig still requires picking a transport; we override at runtime via
# rmw_uros_set_custom_transport().
CONFIG_MICROROS_TRANSPORT_SERIAL=y
CONFIG_MICROROS_SERIAL_PORT="0"

CONFIG_MICROROS_NODES="2"
CONFIG_MICROROS_PUBLISHERS="2"
CONFIG_MICROROS_SUBSCRIBERS="2"
CONFIG_MICROROS_CLIENTS="0"
CONFIG_MICROROS_SERVERS="0"

CONFIG_MAIN_STACK_SIZE=32768
CONFIG_HEAP_MEM_POOL_SIZE=262144

CONFIG_POSIX_API=y

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

CONFIG_STATIC_INIT_GNU=y
