# Self-contained two-node micro-ROS sample, multicore.

CONFIG_MICROROS=y
CONFIG_APP_LINK_WITH_MICROROS=y
# Kconfig still requires picking a transport; we override at runtime via
# rmw_uros_set_custom_transport().
CONFIG_MICROROS_TRANSPORT_SERIAL=y
CONFIG_MICROROS_SERIAL_PORT="0"

CONFIG_MICROROS_NODES="2"
CONFIG_MICROROS_PUBLISHERS="2"
CONFIG_MICROROS_SUBSCRIBERS="2"
CONFIG_MICROROS_CLIENTS="0"
CONFIG_MICROROS_SERVERS="0"

CONFIG_MAIN_STACK_SIZE=32768
# 2x prior — each node's session keeps its own rmw output buffers.
CONFIG_HEAP_MEM_POOL_SIZE=524288

CONFIG_POSIX_API=y

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

CONFIG_STATIC_INIT_GNU=y

# --- SMP + per-thread affinity ----------------------------------------
# board defconfig caps MP_MAX_NUM_CPUS=1; bump for 2 executors + broker
# (+ a head-room hart). Matches the pattern in samples/test_mt_rvv,
# samples/tiled_eigen_mt, etc.
CONFIG_MP_MAX_NUM_CPUS=4
CONFIG_SMP=y
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y

# Required for k_poll, used by the broker to wait on multiple session
# input queues simultaneously.
CONFIG_POLL=y
