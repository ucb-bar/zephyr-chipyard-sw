# Pin to hart 0 (where Gemmini lives). No SMP, no migration.
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_THREAD_STACK_INFO=n
CONFIG_STACK_SENTINEL=n
CONFIG_MP_MAX_NUM_CPUS=1
CONFIG_SMP=n
CONFIG_SCHED_DUMB=y
CONFIG_UART_HTIF_BUFFERED_OUTPUT=y
CONFIG_UART_HTIF_BUFFERED_OUTPUT_SIZE=256
CONFIG_UART_HTIF_SYSCALL_PRINT=y
CONFIG_FPU_SHARING=n
CONFIG_MAIN_STACK_SIZE=131072
CONFIG_COMMON_LIBC_MALLOC=n
CONFIG_HEAP_MEM_POOL_SIZE=67108864
CONFIG_MULTITHREADING=y
CONFIG_FPU=y
