# RoSE co-sim: bridge + protocol + virtual sensor drivers (IMU/flow/downward-ToF + 4x
# multizone ToF), bound by boards/spike_riscv64.overlay.
CONFIG_ROSE=y
CONFIG_ROSE_PROTOCOL=y
CONFIG_ROSE_SENSOR_IMU=y
CONFIG_ROSE_SENSOR_FLOW=y
CONFIG_ROSE_SENSOR_TOF=y
CONFIG_ROSE_SENSOR_TOF_ZONE=y
CONFIG_PICOLIBC=y
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_FPU=y
