# Applied only for -DROSE_THREADED=1 (see CMakeLists). The control loop is paced by a periodic
# timer, so the system tick must be fine enough to represent the control period cleanly
# (200 Hz -> 5 ms; 10 kHz tick = 100 us quantum -> 50 ticks/period). Preemption (vision<->control)
# is instruction-granular and tick-independent, so no cooperative-transport hack is needed:
# the control task WFI-idles between ticks (mtime keeps advancing) and that idle CPU goes to the
# lower-priority vision task by ordinary preemption.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
